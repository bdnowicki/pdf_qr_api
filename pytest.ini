[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning:reportlab.*:
    ignore::DeprecationWarning:PyPDF2.*:

# Coverage settings
addopts = --cov=app --cov=main --cov-report=term-missing --cov-report=html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_* 